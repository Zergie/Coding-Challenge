services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smt
      POSTGRES_USER: smt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smt -d smt"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=smt;Username=smt;Password=${POSTGRES_PASSWORD};SSL Mode=Disable
      Entra__TenantId: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in .env}
      Entra__Audience: ${ENTRA_API_AUDIENCE:?Set ENTRA_API_AUDIENCE in .env}
      Entra__AppIdUri: ${ENTRA_APP_ID_URI:?Set ENTRA_APP_ID_URI in .env}
      Entra__BrowserClientId: ${ENTRA_BROWSER_CLIENT_ID:?Set ENTRA_BROWSER_CLIENT_ID in .env}
      Production__Destination: SMT-LINE-1
volumes:
  postgres-data:
