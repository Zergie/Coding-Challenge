services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-table --tableHost 0.0.0.0 --location /data
    ports:
      - "10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10002,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    depends_on:
      azurite:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      Storage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      Storage__TableName: SmtOrders
      Entra__TenantId: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in .env}
      Entra__Audience: ${ENTRA_API_AUDIENCE:?Set ENTRA_API_AUDIENCE in .env}
      Entra__AppIdUri: ${ENTRA_APP_ID_URI:?Set ENTRA_APP_ID_URI in .env}
      Entra__BrowserClientId: ${ENTRA_BROWSER_CLIENT_ID:?Set ENTRA_BROWSER_CLIENT_ID in .env}
      Production__Destination: SMT-LINE-1
volumes:
  azurite-data:
